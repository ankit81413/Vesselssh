server:
  logging:
    - levels: "info|warning|error"
      apiLevels: ""
      output: "stdout"
      noColors: false
      json: false
      utc: false
      apiFilter: ""
  sources:
    - path: "/"
      name: "Vessel"
      config:
        defaultPermissions:
          view: true
          download: true
          modify: true
          delete: true
          create: true
  database:
    path: "./data/db/filebrowser.sqlite"
auth:
  adminUsername: "**hidden**"
  adminPassword: "**hidden**"
frontend:
  name: "Vessel FileBrowser"
userDefaults:
  account:
    permissions:
      share: true
http:
  port: 48287
