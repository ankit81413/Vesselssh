<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" fill="none">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263942"/>
      <stop offset="1" stop-color="#0c171d"/>
    </linearGradient>
    <linearGradient id="terminalBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17252d"/>
      <stop offset="1" stop-color="#0d181e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09151c"/>
      <stop offset="1" stop-color="#050c11"/>
    </linearGradient>
  </defs>

  <!-- =========================================================
       GIANT TERMINAL — firmly seated behind the cargo
       ========================================================= -->
  <g stroke-linejoin="round">
    <!-- terminal housing -->
    <rect x="300" y="70" width="610" height="365" rx="38"
          fill="url(#terminalBody)" stroke="#1e3039" stroke-width="14"/>

    <!-- terminal top edge / structural lip -->
    <path d="M338 88 H872 Q895 88 895 112"
          stroke="#3e525b" stroke-width="7" opacity=".9"/>

    <!-- terminal display -->
    <rect x="332" y="112" width="546" height="285" rx="27"
          fill="url(#screen)" stroke="#61747d" stroke-width="9"/>

    <!-- terminal header -->
    <circle cx="370" cy="151" r="10" fill="#71838b"/>
    <circle cx="405" cy="151" r="10" fill="#71838b"/>
    <circle cx="440" cy="151" r="10" fill="#71838b"/>

    <!-- giant terminal prompt -->
    <path d="M470 205 L550 258 L470 311"
          stroke="#dce6e8" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M592 313 H735"
          stroke="#dce6e8" stroke-width="22"
          stroke-linecap="round"/>

    <!-- subtle code lines -->
    <path d="M390 347 H505 M525 347 H610 M630 347 H790"
          stroke="#30434c" stroke-width="7" stroke-linecap="round"/>

    <!-- terminal feet / mounting supports -->
    <path d="M440 432 V463 H505 V432 M705 432 V463 H770 V432"
          stroke="#1e3039" stroke-width="14"/>
    <path d="M405 466 H805"
          stroke="#334951" stroke-width="12" stroke-linecap="round"/>

    <!-- terminal antenna / server-like details -->
    <path d="M830 70 V25 M850 70 V38 M870 70 V18"
          stroke="#263b45" stroke-width="8" stroke-linecap="round"/>
    <path d="M825 70 H883"
          stroke="#263b45" stroke-width="8"/>
  </g>

  <!-- =========================================================
       VESSEL HULL
       ========================================================= -->
  <path d="M92 475
           L180 475
           L220 451
           H1005
           L1118 430
           L1150 457
           L1125 523
           Q1102 579 1040 613
           Q1005 632 956 638
           H282
           Q208 632 165 591
           Q130 558 92 475 Z"
        fill="url(#hull)" stroke="#091217" stroke-width="10"/>

  <!-- top deck -->
  <path d="M103 475 H1005 L1118 430"
        stroke="#52666f" stroke-width="9" stroke-linecap="round"/>

  <!-- hull highlights -->
  <path d="M190 552 Q270 600 375 603 H1030"
        stroke="#43565e" stroke-width="6" opacity=".9"/>
  <path d="M240 572 H1040"
        stroke="#2e4149" stroke-width="5"/>
  <path d="M275 548 H1015"
        stroke="#344850" stroke-width="4"/>
  <path d="M355 612 H925"
        stroke="#25373f" stroke-width="4"/>

  <!-- bow -->
  <path d="M92 475 L48 459 L96 511 L165 591"
        fill="#101c23" stroke="#091217" stroke-width="9"/>
  <path d="M53 459 L120 464"
        stroke="#829198" stroke-width="6" stroke-linecap="round"/>

  <!-- stern -->
  <path d="M1118 430 L1150 457 L1125 523"
        fill="#17262e" stroke="#091217" stroke-width="9"/>

  <!-- =========================================================
       CONTAINER CARGO — aligned, interlocked and sitting on deck
       ========================================================= -->

  <!-- container support rails -->
  <path d="M185 454 H1015" stroke="#0a1318" stroke-width="15"/>
  <path d="M190 458 H1010" stroke="#596a72" stroke-width="4"/>

  <!-- bottom row -->
  <g stroke="#15232a" stroke-width="6">
    <rect x="205" y="401" width="135" height="62" rx="2" fill="#496571"/>
    <rect x="344" y="401" width="135" height="62" rx="2" fill="#bd6038"/>
    <rect x="483" y="401" width="135" height="62" rx="2" fill="#2e7f8e"/>
    <rect x="622" y="401" width="135" height="62" rx="2" fill="#a94352"/>
    <rect x="761" y="401" width="135" height="62" rx="2" fill="#d59f2b"/>
    <rect x="900" y="401" width="100" height="62" rx="2" fill="#3c6f86"/>
  </g>

  <!-- middle row -->
  <g stroke="#15232a" stroke-width="6">
    <rect x="180" y="338" width="145" height="63" rx="2" fill="#dc713c"/>
    <rect x="329" y="338" width="145" height="63" rx="2" fill="#2f7f91"/>
    <rect x="478" y="338" width="145" height="63" rx="2" fill="#d9aa2d"/>
    <rect x="627" y="338" width="145" height="63" rx="2" fill="#8f4350"/>
    <rect x="776" y="338" width="145" height="63" rx="2" fill="#3e7189"/>
    <rect x="925" y="338" width="75" height="63" rx="2" fill="#c55e37"/>
  </g>

  <!-- top row -->
  <g stroke="#15232a" stroke-width="6">
    <rect x="214" y="276" width="145" height="62" rx="2" fill="#416b7d"/>
    <rect x="363" y="276" width="145" height="62" rx="2" fill="#c34d42"/>
    <rect x="512" y="276" width="145" height="62" rx="2" fill="#789344"/>
    <rect x="661" y="276" width="145" height="62" rx="2" fill="#dfa42b"/>
    <rect x="810" y="276" width="145" height="62" rx="2" fill="#3d7189"/>
  </g>

  <!-- container corner locks -->
  <g fill="#0e1a20">
    <circle cx="190" cy="398" r="5"/><circle cx="325" cy="398" r="5"/>
    <circle cx="339" cy="398" r="5"/><circle cx="474" cy="398" r="5"/>
    <circle cx="478" cy="398" r="5"/><circle cx="618" cy="398" r="5"/>
    <circle cx="622" cy="398" r="5"/><circle cx="757" cy="398" r="5"/>
    <circle cx="761" cy="398" r="5"/><circle cx="896" cy="398" r="5"/>
  </g>

  <!-- corrugated container faces -->
  <g stroke="#ffffff" stroke-width="2.5" opacity=".18">
    <path d="M194 344v51M210 344v51M226 344v51M242 344v51M258 344v51M274 344v51M290 344v51"/>
    <path d="M343 344v51M359 344v51M375 344v51M391 344v51M407 344v51M423 344v51M439 344v51"/>
    <path d="M184 282v50M200 282v50M216 282v50M232 282v50M248 282v50M264 282v50"/>
    <path d="M368 282v50M384 282v50M400 282v50M416 282v50M432 282v50M448 282v50"/>
    <path d="M517 282v50M533 282v50M549 282v50M565 282v50M581 282v50M597 282v50"/>
    <path d="M666 282v50M682 282v50M698 282v50M714 282v50M730 282v50"/>
  </g>

  <!-- =========================================================
       REAR SHIP SUPERSTRUCTURE — physically connected to hull
       ========================================================= -->
  <g stroke="#15252d" stroke-linejoin="round">
    <!-- stern block -->
    <path d="M875 226 H1010 V455 H875 Z"
          fill="#d9e1e2" stroke-width="8"/>
    <!-- bridge windows -->
    <rect x="895" y="250" width="105" height="52"
          fill="#285c70" stroke-width="6"/>
    <rect x="895" y="315" width="105" height="52"
          fill="#285c70" stroke-width="6"/>
    <rect x="895" y="380" width="105" height="38"
          fill="#b9c7ca" stroke-width="6"/>
    <!-- roof -->
    <path d="M870 226 H1015 L1000 207 H885 Z"
          fill="#1a2a32" stroke-width="7"/>
  </g>

  <!-- connected funnel/chimney -->
  <g stroke="#17272f" stroke-linejoin="round">
    <path d="M926 207 V145 L908 112 H985 L967 145 V207 Z"
          fill="#dfb12e" stroke-width="8"/>
    <path d="M913 124 H980"
          stroke="#8d6b18" stroke-width="11"/>
    <path d="M925 150 H970"
          stroke="#a67d1b" stroke-width="6"/>
    <!-- exhaust pipe visibly enters funnel -->
    <path d="M946 112 V84"
          stroke="#1c3039" stroke-width="12"/>
    <path d="M934 84 H958"
          stroke="#1c3039" stroke-width="9"/>
  </g>

  <!-- mast above superstructure -->
  <g stroke="#263b44" stroke-linecap="round">
    <path d="M885 205 V105" stroke-width="7"/>
    <path d="M885 115 H955" stroke-width="6"/>
    <path d="M915 115 V76" stroke-width="5"/>
    <path d="M945 115 V88" stroke-width="5"/>
    <path d="M890 105 V58 M905 105 V70 M930 105 V50"
          stroke-width="4"/>
  </g>

  <!-- bow mast -->
  <g stroke="#263a43" stroke-linecap="round">
    <path d="M150 454 V178" stroke-width="8"/>
    <path d="M150 207 H220" stroke-width="6"/>
    <path d="M183 207 V170" stroke-width="5"/>
    <path d="M150 190 L105 255 M150 190 L195 255"
          stroke="#687b83" stroke-width="4"/>
    <path d="M112 252 H190" stroke="#687b83" stroke-width="4"/>
  </g>

  <!-- bow navigation light -->
  <circle cx="150" cy="173" r="7" fill="#e0b12d" stroke="#17272f" stroke-width="4"/>

  <!-- deck railings -->
  <g stroke="#8a999e" stroke-width="4" opacity=".9">
    <path d="M105 430 H180"/>
    <path d="M112 418 H180"/>
    <path d="M1010 430 H1095"/>
    <path d="M1025 418 H1100"/>
  </g>

  <!-- anchor -->
  <g stroke="#aab6ba" stroke-width="6" stroke-linecap="round">
    <path d="M112 480 V516"/>
    <path d="M92 497 H132"/>
    <path d="M97 516 Q112 537 127 516"/>
  </g>

  <!-- small portholes -->
  <g fill="#0b171d" stroke="#60727a" stroke-width="3">
    <circle cx="270" cy="507" r="7"/>
    <circle cx="305" cy="507" r="7"/>
    <circle cx="340" cy="507" r="7"/>
    <circle cx="375" cy="507" r="7"/>
  </g>

  <!-- water accent -->
  <path d="M82 655
           C145 642 205 670 268 655
           C331 640 391 670 454 655
           C517 640 577 670 640 655
           C703 640 763 670 826 655
           C889 640 949 670 1012 655
           C1060 645 1098 648 1135 655"
        stroke="currentColor" stroke-width="9"
        stroke-linecap="round"/>

  <!-- small secondary wave -->
  <path d="M170 682 H430 M790 682 H1030"
        stroke="currentColor" stroke-width="5"
        stroke-linecap="round" opacity=".65"/>
</svg>